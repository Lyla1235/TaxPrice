<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        price=[12.98,14.20,5.86,9.25,14.7];
        taxed=price.map(function(num){
            return num + num * 0.13
        });
        console.log(taxed);
        formatted=taxed.map(function(num){
            return '$' + num.toFixed(2)
        })
        console.log(formatted);

    </script>
</body>
</html>
